<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Character encoding for the document -->
  <meta charset="UTF-8">

  <!-- Responsive design settings to ensure proper rendering on mobile devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Compatibility settings for Internet Explorer -->
  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <!-- Link to Bootstrap CSS for styling the page -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <!-- Link to Bootstrap Icons for using icon fonts -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Link to custom stylesheet for additional styles specific to the Blackjack game -->
  <link rel="stylesheet" href="css/blackjack_style.css">

  <!-- Title of the webpage, displayed in the browser tab -->
  <title>Blackjack</title>
</head>

<body>
  <main class="game-table" aria-label="Blackjack 25">

    <button id="new_game" class="game-button new-game"
            type="button" onclick="newGame()">
      New Game
    </button>

    <aside class="table-info">
      <p>Bet: <span id="bet-display">10 €</span></p>
      <p>Balance: <span id="balance-display">1 000 €</span></p>
      <label for="bet-amount">Wager</label>
      <input id="bet-amount" type="number" min="10" step="1" value="10"
             aria-label="Bet amount" oninput="bettingSystem.updateDisplay()">
    </aside>

    <div class="shoe" aria-hidden="true">
      <img src="img/png/card_back.png" alt="">
      <img src="img/png/card_back.png" alt="">
      <img src="img/png/card_back.png" alt="">
    </div>

    <section class="dealer-area" aria-label="Dealer">
      <div id="dealer-cards" class="card-row"></div>
      <h2 id="dealer">Dealer: ?</h2>
    </section>

    <section class="player-area" aria-label="Player">
      <h2 id="player">Hand: 0</h2>
      <div id="player-cards" class="card-row"></div>
    </section>

    <nav class="game-actions" aria-label="Game actions">
      <button id="stand" class="game-button stand-button"
              type="button" onclick="dealerFinish()" disabled>Stand</button>

      <button id="card" class="game-button hit-button"
              type="button" onclick="playerNewCard()" disabled>Hit</button>

      <button id="double_down" class="game-button double-button"
              type="button" onclick="doubleDown()" disabled>Double</button>
    </nav>

    <p id="game_status" class="game-status" aria-live="polite"></p>
    <p id="debug" class="visually-hidden" aria-hidden="true"></p>
    <audio id="new-card-sound" src="audio/Newcard.mp3" preload="auto"></audio>
  </main>

  <script src="js/blackjack_object.js"></script>
  <script src="js/blackjack_manager.js"></script>

  <!-- Link to Bootstrap's JavaScript bundle for interactive components -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

  <script src="js/betting_balance.js"></script>
  <script>
    window.onload = bettingSystem.initialize.bind(bettingSystem);
  </script>
</body>

</html>
